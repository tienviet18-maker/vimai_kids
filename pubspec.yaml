name: mai_an_learning
description: ViMai Kids — educational app for Vietnamese children
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.4.3
  audioplayers: ^6.5.1
  go_router: ^12.1.1
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  shared_preferences: ^2.5.5
  uuid: ^4.6.0
  url_launcher: ^6.3.1
  lottie: ^3.1.2
  google_fonts: ^6.2.1
  flutter_svg: ^2.0.10

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  audioplayers_platform_interface: ^7.2.0
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: true
  ios: false
  image_path: assets/images/branding/app_icon.png
  adaptive_icon_background: "#FF7E40"
  adaptive_icon_foreground: assets/images/branding/app_icon_foreground.png
  adaptive_icon_padding: true
  min_sdk_android: 21
  remove_alpha_ios: true

flutter:
  uses-material-design: true
  assets:
    - assets/images/branding/
    - assets/data/
    - assets/data/vietnamese/
    - assets/data/japanese/
    - assets/data/math/
    - assets/data/thinking/
    - assets/content/japanese/kana/
    - assets/content/japanese/strokes/
    - assets/content/japanese/strokes/svg/
    - assets/content/vietnamese/
    - assets/content/math/
    - assets/content/thinking/
    - assets/content/games/
    - assets/licenses/
    - assets/illustrations/
    - assets/audio/
    - assets/audio/audio_manifest.json
